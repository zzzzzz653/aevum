[package]
name = "sim_core"
version = "0.1.0"
edition = "2021"

[features]
default = []
visualizer = ["wgpu", "winit", "pollster"]

[dependencies]
# ECS и данные
rayon = "1.8"
parking_lot = "0.12"
smallvec = "1.11"
bytemuck = { version = "1.14", features = ["derive"] }

# Математика
glam = "0.25"

# Сериализация
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"

# Python binding
pyo3 = { version = "0.20", features = ["extension-module"] }

# Рандом (детерминированный)
rand = "0.8"
rand_xoshiro = "0.6"

# Профилирование
instant = "0.1"

# Графика и окно (опционально для визуализатора)
wgpu = { version = "0.19", optional = true }
winit = { version = "0.29", optional = true }
egui = { version = "0.26", optional = true }
egui-wgpu = { version = "0.26", optional = true }
egui-winit = { version = "0.26", optional = true }
pollster = { version = "0.3", optional = true }

[[bin]]
name = "sim_core"
path = "src/main.rs"

[lib]
name = "sim_core"
crate-type = ["cdylib", "rlib"]
