[package]
name = "sim_core"
version = "0.1.0"
edition = "2021"

[dependencies]
# ECS и данные
rayon = "1.8"
parking_lot = "0.12"
smallvec = "1.11"
bytemuck = { version = "1.14", features = ["derive"] }

# Математика
glam = "0.25"

# Сериализация
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"

# Python binding
pyo3 = { version = "0.20", features = ["extension-module"] }

# Рандом (детерминированный)
rand = "0.8"
rand_xoshiro = "0.6"

# Профилирование
instant = "0.1"

# Графика и окно
wgpu = "0.19"
winit = "0.29"
egui = "0.26"
egui-wgpu = "0.26"
egui-winit = "0.26"
pollster = "0.3"

[[bin]]
name = "sim_core"
path = "src/main.rs"

[lib]
name = "sim_core"
crate-type = ["cdylib", "rlib"]
